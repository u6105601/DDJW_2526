<!DOCTYPE html> 
<html>
	<head>
        <meta charset="UTF-8">
		<title>Memory - Opcions</title>
		<link rel="stylesheet" href="../styles/main.css">
		<script src="../js/options.js" type="module"></script>
	</head>
	<body>
		<h1>Opcions</h1>
        <div class="contingidor-opcions">
			<label for="grups">Número de cartes diferents:</label>
			<input type="number" id="grups" value="2" min="2" max="6">
			
			<label for="mida">Mida del grup:</label>
			<select id="mida">
				<option value="2" selected>Parelles (2)</option>
				<option value="3">Trios (3)</option>
				<option value="4">Quartets (4)</option>
			</select>

			<label for="dificultat">Dificultat inicial (Mode 2):</label>
			<select id="dificultat">
				<option value="facil">Fàcil</option>
				<option value="normal" selected>Normal</option>
				<option value="dificil">Difícil</option>
			</select>

			<button id="defecte">Per defecte</button>
			<button id="aplicar">Aplicar</button>
		</div>
	</body>
</html>
